<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Clients — Luciano Campos</title>

	<meta name="description" content="Selected clients and collaborations by Luciano Campos.">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="/css/style.css">

	<style>
		.client-logo {
			background: #ffffff;
			border-radius: 18px;
			padding: 40px;
			height: 220px;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 18px 45px rgba(0,0,0,0.06);
			transition: transform 0.25s ease;
		}

		.client-logo:hover {
			transform: translateY(-4px);
		}

		.client-logo img {
			max-width: 100%;
			max-height: 120px;
			object-fit: contain;
		}
	</style>

</head>

<body>

	<div id="navbar-placeholder"></div>

	<main>

		<section class="selected-work">

			<div class="container">

				<div class="row mb-5">

					<div class="col-lg-9">

						<p class="eyebrow">
							Client Experience
						</p>

						<h1 class="hero-title">
							Brands, publications, and collaborations across editorial, digital, and visual communication.
						</h1>

						<p class="hero-subtitle">
							A selection of companies, publications, and organizations connected to projects developed across Brazil and the United States.
						</p>

					</div>

				</div>

				<div class="row">

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/1.png" alt="Client Logo 1">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/2.png" alt="Client Logo 2">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/3.png" alt="Client Logo 3">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/4.png" alt="Client Logo 4">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/5.png" alt="Client Logo 5">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/6.png" alt="Client Logo 6">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/7.png" alt="Client Logo 7">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/8.png" alt="Client Logo 8">
						</div>
					</div>

					<div class="col-md-4 mb-5">
						<div class="client-logo">
							<img src="/clients/images/9.png" alt="Client Logo 9">
						</div>
					</div>

				</div>

			</div>

		</section>

	</main>

	<footer>

		<div class="container">

			<div class="row align-items-center">

				<div class="col-md-6 text-center text-md-left mb-3 mb-md-0">

					<p class="footer-text mb-0">
						Product • Brand • UI/UX Designer
					</p>

				</div>

				<div class="col-md-6 text-center text-md-right">

					<p class="footer-text mb-0">
						© 2026 Luciano Campos
					</p>

				</div>

			</div>

		</div>

	</footer>

	<script>
		fetch('/navbar.html')
			.then(response => response.text())
			.then(data => {
				document.getElementById('navbar-placeholder').innerHTML = data;
			});
	</script>

	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</body>

</html>
