<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kemper Brochures — Luciano Campos</title>

  <meta name="description" content="Kemper brochure design work by Luciano Campos.">

  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">

  <link rel="stylesheet" href="/brand/style.css">

  <style>
    .brochure-buckets-section {
      padding-bottom: 90px;
    }

    .brochure-bucket {
      margin-bottom: 80px;
    }

    .brochure-cover-card {
      margin-bottom: 36px;
      cursor: default;
    }

    .brochure-cover-card:hover {
      text-decoration: none;
    }

    .brochure-cover-card .project-image {
      width: 100%;
      height: 520px;
      object-fit: contain;
      object-position: center;
      background: #f2f2ef;
      padding: 28px;
    }

    .brochure-pages-stack {
      width: 100%;
    }

    .brochure-page-item {
      width: 100%;
      margin-bottom: 34px;
    }

    .brochure-page-item:last-child {
      margin-bottom: 0;
    }

    .brochure-page-card {
      overflow: hidden;
      border-radius: 24px;
      background: #f2f2ef;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.045);
    }

    .brochure-page-card img {
      width: 100%;
      height: auto;
      max-height: none;
      display: block;
      object-fit: contain;
      object-position: center;
      background: #f2f2ef;
      padding: 24px;
    }

    .brochure-page-caption {
      padding: 18px 22px;
      background: #ffffff;
    }

    .brochure-page-caption span {
      display: block;
      color: #777777;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 991px) {
      .brochure-cover-card .project-image {
        height: 420px;
      }
    }

    @media (max-width: 767px) {
      .brochure-bucket {
        margin-bottom: 56px;
      }

      .brochure-cover-card .project-image {
        height: 320px;
        padding: 18px;
      }

      .brochure-page-card img {
        padding: 16px;
      }
    }
  </style>

</head>

<body>

  <div id="navbar-placeholder"></div>

  <main>

    <section class="selected-work brand-project-page">

      <div class="container">

        <div class="row mb-5">

          <div class="col-lg-9">

            <p class="eyebrow">
              Kemper
            </p>

            <h1 class="hero-title">
              Brochures
            </h1>

            <p class="hero-subtitle">
              Brochure and report layouts designed for corporate communication, brand storytelling, and structured editorial presentation.
            </p>

          </div>

        </div>

      </div>

    </section>

    <section class="brochure-buckets-section">

      <div class="container">

        <div class="category-header">

          <p class="eyebrow">
            Category
          </p>

          <h2>
            Brochures
          </h2>

        </div>

        <div id="brochure-buckets"></div>

      </div>

    </section>

    <section class="brand-back-section">

      <div class="container">

        <a href="/brand/kemper/" class="brand-back-link">
          ← Back to Kemper
        </a>

      </div>

    </section>

  </main>

  <footer class="footer-section">

    <div class="container">

      <div class="row align-items-center">

        <div class="col-md-6 text-left">

          <p class="footer-copy mb-0">
            Product • Brand • UI/UX Designer
          </p>

        </div>

        <div class="col-md-6 text-md-right text-left mt-3 mt-md-0">

          <p class="footer-copy mb-0">
            © 2026 Luciano Campos
          </p>

        </div>

      </div>

    </div>

  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>

  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

  <script>
    fetch('/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });

    function padNumber(number) {
      return String(number).padStart(2, '0');
    }

    function createImagePage(src, alt, captionText) {
      var item = document.createElement('div');
      item.className = 'brochure-page-item';

      var card = document.createElement('div');
      card.className = 'brochure-page-card';

      var image = document.createElement('img');
      image.src = src;
      image.alt = alt;

      var caption = document.createElement('div');
      caption.className = 'brochure-page-caption';

      var label = document.createElement('span');
      label.textContent = captionText;

      caption.appendChild(label);
      card.appendChild(image);
      card.appendChild(caption);
      item.appendChild(card);

      return item;
    }

    function createBrochureBucket(brochure) {
      var bucket = document.createElement('div');
      bucket.className = 'brochure-bucket';

      var coverCard = document.createElement('div');
      coverCard.className = 'project-card brochure-cover-card';

      var coverImage = document.createElement('img');
      coverImage.src = brochure.cover.src;
      coverImage.alt = brochure.cover.alt;
      coverImage.className = 'img-fluid project-image';

      var projectInfo = document.createElement('div');
      projectInfo.className = 'project-info';

      var category = document.createElement('span');
      category.className = 'project-category';
      category.textContent = brochure.category;

      var title = document.createElement('h3');
      title.className = 'project-title';
      title.textContent = brochure.title;

      projectInfo.appendChild(category);
      projectInfo.appendChild(title);

      coverCard.appendChild(coverImage);
      coverCard.appendChild(projectInfo);

      var pagesStack = document.createElement('div');
      pagesStack.className = 'brochure-pages-stack';

      for (var i = 0; i < brochure.pages.length; i++) {
        pagesStack.appendChild(
          createImagePage(
            brochure.pages[i].src,
            brochure.pages[i].alt,
            brochure.pages[i].caption
          )
        );
      }

      bucket.appendChild(coverCard);
      bucket.appendChild(pagesStack);

      return bucket;
    }

    function buildBrochure01Pages() {
      var pages = [];

      for (var i = 1; i <= 20; i++) {
        pages.push({
          src: '/brand/kemper/brochure/images/brochure-01/brochure-01-' + padNumber(i) + '.jpg',
          alt: 'Kemper brochure 01 page ' + padNumber(i),
          caption: 'Brochure 01 / Page ' + padNumber(i)
        });
      }

      return pages;
    }

    function buildBrochure02Pages() {
      var pages = [];

      for (var i = 2; i <= 31; i++) {
        pages.push({
          src: '/brand/kemper/brochure/images/brochure-02/Corporate_Responsability_Report-2024-06.20.24.1_Page_' + padNumber(i) + '.jpg',
          alt: 'Corporate Responsibility Report page ' + padNumber(i),
          caption: 'Brochure 02 / Page ' + padNumber(i)
        });
      }

      return pages;
    }

    function buildBrochure03Pages() {
      var pages = [];

      for (var i = 2; i <= 3; i++) {
        pages.push({
          src: '/brand/kemper/brochure/images/brochure-03/25_14351_KL-Vanguard-Conference-2026-Digital-Flyer-V.22_Page_' + i + '.jpg',
          alt: 'Kemper brochure 03 page ' + padNumber(i),
          caption: 'Brochure 03 / Page ' + padNumber(i)
        });
      }

      return pages;
    }

    function buildBrochure04Pages() {
      return [
        {
          src: '/brand/kemper/brochure/images/brochure-04/25_03852_KL-Contents-Fire-V.09_Page_2.jpg',
          alt: 'Kemper brochure 04 page 02',
          caption: 'Brochure 04 / Page 02'
        }
      ];
    }

    var brochures = [
      {
        category: 'Brochure 01',
        title: 'Vanguard Leaders Conference',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-01/brochure-01-cover.jpg',
          alt: 'Kemper Vanguard Leaders Conference brochure cover'
        },
        pages: buildBrochure01Pages()
      },
      {
        category: 'Brochure 02',
        title: 'Corporate Responsibility Report',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-02/Corporate_Responsability_Report-2024-06.20.24.1_Page_01.jpg',
          alt: 'Kemper Corporate Responsibility Report brochure cover'
        },
        pages: buildBrochure02Pages()
      },
      {
        category: 'Brochure 03',
        title: 'Vanguard Conference Digital Flyer',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-03/25_14351_KL-Vanguard-Conference-2026-Digital-Flyer-V.22_Page_1.jpg',
          alt: 'Kemper Vanguard Conference Digital Flyer cover'
        },
        pages: buildBrochure03Pages()
      },
      {
        category: 'Brochure 04',
        title: 'Contents / Fire Insurance',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-04/25_03852_KL-Contents-Fire-V.09_Page_1.jpg',
          alt: 'Kemper Contents Fire Insurance brochure cover'
        },
        pages: buildBrochure04Pages()
      }
    ];

    var brochureContainer = document.getElementById('brochure-buckets');

    if (brochureContainer) {
      for (var b = 0; b < brochures.length; b++) {
        brochureContainer.appendChild(createBrochureBucket(brochures[b]));
      }
    }
  </script>

</body>

</html>
