<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kemper Brochures — Luciano Campos</title>

  <meta name="description" content="Kemper brochure design work by Luciano Campos.">

  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">

  <link rel="stylesheet" href="/brand/style.css">

  <style>
    .brochure-buckets-section {
      padding-bottom: 78px;
    }

    .brochure-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 34px;
    }

    .brochure-bucket {
      display: block;
      color: inherit;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .brochure-bucket:hover {
      color: inherit;
      text-decoration: none;
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
    }

    .brochure-cover-wrap {
      background: #f2f2ef;
      padding: 18px;
    }

    .brochure-cover-wrap img {
      width: 100%;
      height: 340px;
      display: block;
      object-fit: contain;
      object-position: center;
    }

    .brochure-bucket-content {
      padding: 26px;
    }

    .brochure-bucket-content .project-category {
      display: block;
      margin-bottom: 10px;
    }

    .brochure-bucket-content .project-title {
      margin-bottom: 12px;
    }

    .brochure-bucket-content p {
      margin-bottom: 18px;
      max-width: 560px;
    }

    .brochure-view-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #111111;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brochure-view-link::after {
      content: "→";
      transition: transform 0.25s ease;
    }

    .brochure-bucket:hover .brochure-view-link::after {
      transform: translateX(4px);
    }

    .brochure-viewer {
      display: none;
      margin-top: 44px;
      padding-top: 34px;
      border-top: 1px solid rgba(0, 0, 0, 0.14);
    }

    .brochure-viewer.active {
      display: block;
      animation: fadeUpVisible 0.5s ease both;
    }

    .brochure-viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 34px;
    }

    .brochure-viewer-header h2 {
      margin-bottom: 12px;
    }

    .brochure-viewer-header p {
      max-width: 620px;
      margin-bottom: 0;
    }

    .brochure-close-button {
      border: 1px solid rgba(0, 0, 0, 0.14);
      background: #ffffff;
      color: #111111;
      border-radius: 11px;
      padding: 12px 22px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .brochure-close-button:hover {
      background: #111111;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .brochure-pages-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    .brochure-page-card {
      overflow: hidden;
      border-radius: 22px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.06);
    }

    .brochure-page-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      object-position: center;
      background: #f2f2ef;
      padding: 18px;
    }

    .brochure-page-caption {
      padding: 16px 18px;
      background: #ffffff;
    }

    .brochure-page-caption span {
      display: block;
      color: #777777;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-back-section {
      padding-top: 0;
    }

    @media (max-width: 991px) {
      .brochure-grid {
        grid-template-columns: 1fr;
      }

      .brochure-cover-wrap img {
        height: 300px;
      }

      .brochure-viewer-header {
        flex-direction: column;
      }

      .brochure-pages-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 767px) {
      .brochure-cover-wrap img {
        height: 260px;
      }

      .brochure-bucket-content {
        padding: 22px;
      }

      .brochure-page-card img {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <main>

    <section class="selected-work brand-project-page">
      <div class="container">

        <div class="row mb-5">
          <div class="col-lg-9">

            <p class="eyebrow">Kemper</p>

            <h1 class="hero-title">
              Brochures
            </h1>

            <p class="hero-subtitle">
              Brochure and report layouts designed for corporate communication, brand storytelling, and structured editorial presentation.
            </p>

          </div>
        </div>

      </div>
    </section>

    <section class="brochure-buckets-section">
      <div class="container">

        <div class="category-header">
          <p class="eyebrow">Category</p>

          <h2>
            Brochures
          </h2>
        </div>

        <div class="brochure-grid" id="brochure-grid"></div>

        <div class="brochure-viewer" id="brochure-viewer">
          <div class="brochure-viewer-header">
            <div>
              <p class="eyebrow" id="viewer-category">Brochure</p>

              <h2 id="viewer-title">
                Brochure
              </h2>

              <p id="viewer-description">
                Selected brochure pages.
              </p>
            </div>

            <button class="brochure-close-button" type="button" id="close-viewer">
              Close
            </button>
          </div>

          <div class="brochure-pages-grid" id="brochure-pages-grid"></div>
        </div>

      </div>
    </section>

    <section class="brand-back-section">
      <div class="container">
        <a href="/brand/kemper/" class="brand-back-link">
          ← Back to Kemper
        </a>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <div class="row align-items-center">

        <div class="col-md-6 text-left">
          <p class="footer-text">
            Product • Brand • UI/UX Designer
          </p>
        </div>

        <div class="col-md-6 text-md-right text-left mt-3 mt-md-0">
          <p class="footer-text">
            © 2026 Luciano Campos
          </p>
        </div>

      </div>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>

  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

  <script>
    fetch('/navbar.html')
      .then(function(response) {
        return response.text();
      })
      .then(function(data) {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });

    function padNumber(number) {
      return String(number).padStart(2, '0');
    }

    function buildBrochure01Pages() {
      var pages = [];

      for (var i = 1; i <= 20; i++) {
        pages.push({
          src: '/brand/kemper/brochure/images/brochure-01/brochure-01-' + padNumber(i) + '.jpg',
          alt: 'Kemper brochure 01 page ' + padNumber(i),
          caption: 'Brochure 01 / Page ' + padNumber(i)
        });
      }

      return pages;
    }

    function buildBrochure02Pages() {
      var pages = [];

      for (var i = 2; i <= 31; i++) {
        pages.push({
          src: '/brand/kemper/brochure/images/brochure-02/Corporate_Responsability_Report-2024-06.20.24.1_Page_' + padNumber(i) + '.jpg',
          alt: 'Corporate Responsibility Report page ' + padNumber(i),
          caption: 'Brochure 02 / Page ' + padNumber(i)
        });
      }

      return pages;
    }

    var brochures = [
      {
        category: 'Brochure 01',
        title: 'Vanguard Leaders Conference',
        description: 'Multi-page corporate brochure layout with cover and internal pages.',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-01/cover.jpg',
          alt: 'Kemper brochure 01 cover'
        },
        pages: buildBrochure01Pages()
      },
      {
        category: 'Brochure 02',
        title: 'Corporate Responsibility Report',
        description: 'Long-form report layout structured for corporate storytelling and information design.',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-02/cover.jpg',
          alt: 'Kemper Corporate Responsibility Report cover'
        },
        pages: buildBrochure02Pages()
      },
      {
        category: 'Brochure 03',
        title: 'Vanguard Conference Digital Flyer',
        description: 'Short brochure/flyer layout with focused visual presentation.',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-03/cover.jpg',
          alt: 'Kemper brochure 03 cover'
        },
        pages: [
          {
            src: '/brand/kemper/brochure/images/brochure-03/brochure-02.jpg',
            alt: 'Kemper brochure 03 page 02',
            caption: 'Brochure 03 / Page 02'
          },
          {
            src: '/brand/kemper/brochure/images/brochure-03/brochure-03.jpg',
            alt: 'Kemper brochure 03 page 03',
            caption: 'Brochure 03 / Page 03'
          }
        ]
      },
      {
        category: 'Brochure 04',
        title: 'Contents / Fire Insurance',
        description: 'Single brochure page presented as a compact campaign and communication asset.',
        cover: {
          src: '/brand/kemper/brochure/images/brochure-04/cover.jpg',
          alt: 'Kemper brochure 04 cover'
        },
        pages: [
          {
            src: '/brand/kemper/brochure/images/brochure-04/brochure-01.jpg',
            alt: 'Kemper brochure 04 page 01',
            caption: 'Brochure 04 / Page 01'
          }
        ]
      }
    ];

    var brochureGrid = document.getElementById('brochure-grid');
    var brochureViewer = document.getElementById('brochure-viewer');
    var viewerCategory = document.getElementById('viewer-category');
    var viewerTitle = document.getElementById('viewer-title');
    var viewerDescription = document.getElementById('viewer-description');
    var brochurePagesGrid = document.getElementById('brochure-pages-grid');
    var closeViewer = document.getElementById('close-viewer');

    function createBrochureBucket(brochure, index) {
      var bucket = document.createElement('div');
      bucket.className = 'brochure-bucket';
      bucket.setAttribute('role', 'button');
      bucket.setAttribute('tabindex', '0');
      bucket.setAttribute('aria-label', 'View full brochure: ' + brochure.title);

      var coverWrap = document.createElement('div');
      coverWrap.className = 'brochure-cover-wrap';

      var coverImage = document.createElement('img');
      coverImage.src = brochure.cover.src;
      coverImage.alt = brochure.cover.alt;
      coverImage.loading = 'lazy';

      coverWrap.appendChild(coverImage);

      var content = document.createElement('div');
      content.className = 'brochure-bucket-content';

      var category = document.createElement('span');
      category.className = 'project-category';
      category.textContent = brochure.category;

      var title = document.createElement('h3');
      title.className = 'project-title';
      title.textContent = brochure.title;

      var description = document.createElement('p');
      description.textContent = brochure.description;

      var viewLink = document.createElement('span');
      viewLink.className = 'brochure-view-link';
      viewLink.textContent = 'View full brochure';

      content.appendChild(category);
      content.appendChild(title);
      content.appendChild(description);
      content.appendChild(viewLink);

      bucket.appendChild(coverWrap);
      bucket.appendChild(content);

      bucket.addEventListener('click', function() {
        openBrochure(index);
      });

      bucket.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openBrochure(index);
        }
      });

      return bucket;
    }

    function createPageCard(page) {
      var card = document.createElement('div');
      card.className = 'brochure-page-card';

      var image = document.createElement('img');
      image.src = page.src;
      image.alt = page.alt;
      image.loading = 'lazy';

      var caption = document.createElement('div');
      caption.className = 'brochure-page-caption';

      var captionText = document.createElement('span');
      captionText.textContent = page.caption;

      caption.appendChild(captionText);

      card.appendChild(image);
      card.appendChild(caption);

      return card;
    }

    function openBrochure(index) {
      var brochure = brochures[index];

      viewerCategory.textContent = brochure.category;
      viewerTitle.textContent = brochure.title;
      viewerDescription.textContent = brochure.description;

      brochurePagesGrid.innerHTML = '';

      for (var i = 0; i < brochure.pages.length; i++) {
        brochurePagesGrid.appendChild(createPageCard(brochure.pages[i]));
      }

      brochureViewer.classList.add('active');

      brochureViewer.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }

    closeViewer.addEventListener('click', function() {
      brochureViewer.classList.remove('active');
      brochurePagesGrid.innerHTML = '';
    });

    for (var b = 0; b < brochures.length; b++) {
      brochureGrid.appendChild(createBrochureBucket(brochures[b], b));
    }
  </script>

</body>
</html>
