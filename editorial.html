<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Editorial — Luciano Campos</title>
	<meta name="description" content="Editorial and print design work by Luciano Campos.">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">

	<style>
		.editorial-gallery-image {
			width: 100%;
			height: 420px;
			object-fit: contain;
			object-position: center;
			border-radius: 22px;
			background-color: #ffffff;
			box-shadow: 0 22px 55px rgba(0,0,0,0.08);
			padding: 24px;
		}
	</style>
</head>

<body>

	<div id="navbar-placeholder"></div>

	<main>
		<section class="selected-work">
			<div class="container">

				<div class="row mb-5">
					<div class="col-lg-9">
						<p class="eyebrow">Editorial Design</p>

						<h1 class="hero-title">
							Print and publication systems designed through hierarchy, rhythm, and visual storytelling.
						</h1>

						<p class="hero-subtitle">
							A curated collection of editorial layouts, print campaigns, catalogs, and publication design projects.
						</p>
					</div>
				</div>

				<div class="row">

					<div class="col-md-6 mb-5">
						<img src="/images/work/ESH_Veja_SP_(202x131)mm_25Nov2011_B.png" alt="Editorial Project" class="img-fluid editorial-gallery-image">
					</div>

					<div class="col-md-6 mb-5">
						<img src="/images/work/Especial_NY_KAZA130_Page_3.png" alt="Editorial Layout" class="img-fluid editorial-gallery-image">
					</div>

					<div class="col-md-6 mb-5">
						<img src="/images/work/Totens_Alphaville_50x70.png" alt="Editorial Campaign" class="img-fluid editorial-gallery-image">
					</div>

					<div class="col-md-6 mb-5">
						<img src="/images/work/Catalogo_Page_7.png" alt="Catalog Design" class="img-fluid editorial-gallery-image">
					</div>

					<div class="col-md-6 mb-5">
						<img src="/images/work/Catalogo_Page_-1.png" alt="Editorial Communication" class="img-fluid editorial-gallery-image">
					</div>

				</div>

			</div>
		</section>
	</main>

	<footer>
		<div class="container">
			<div class="row align-items-center">
				<div class="col-md-6 text-center text-md-left mb-3 mb-md-0">
					<p class="footer-text mb-0">Product • Brand • UI/UX Designer</p>
				</div>
				<div class="col-md-6 text-center text-md-right">
					<p class="footer-text mb-0">© 2026 Luciano Campos</p>
				</div>
			</div>
		</div>
	</footer>

	<script>
		fetch('/navbar.html')
			.then(response => response.text())
			.then(data => {
				document.getElementById('navbar-placeholder').innerHTML = data;
			});
	</script>

	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</body>
</html>
